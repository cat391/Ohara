name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build-macos:
    runs-on: macos-latest # arm64 (Apple Silicon)
    permissions:
      contents: write # create the GitHub Release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - name: Install Python dependencies
        # llama-cpp-python compiles from source here; macOS arm64 builds with Metal by default
        run: pip install -r requirements.txt pyinstaller

      - name: Build backend sidecar
        run: bash scripts/build-backend.sh

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build Tauri app
        run: npx tauri build
        working-directory: frontend

      - name: Create GitHub Release with the .dmg
        uses: softprops/action-gh-release@v2
        with:
          files: frontend/src-tauri/target/release/bundle/dmg/*.dmg
          generate_release_notes: true
