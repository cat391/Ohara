services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      - OHARA_VAULT=/data/vault
      - OHARA_CORS_ORIGINS=http://localhost:3000
    volumes:
      - ./vault:/data/vault:ro
      - ohara-qdrant:/app/backend/qdrant_db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/status"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ohara-qdrant:
